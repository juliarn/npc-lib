name: Validate
on:
  push:
    branches: [ "**" ]
    tags-ignore: [ "**" ]
  pull_request:

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: validate-${{ github.event.pull_request.number || github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup java
        uses: actions/setup-java@v5
        with:
          java-version: 25
          check-latest: true
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: always
          cache-provider: enhanced
          cache-cleanup: on-success
          cache-read-only: ${{ github.ref != 'refs/heads/v3' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # automatically publishes build scans on main branch
          build-scan-publish: ${{ github.ref == 'refs/heads/v3' }}
          build-scan-terms-of-use-agree: yes
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'

      - name: Setup Loom cache
        uses: actions/cache@v6
        with:
          path: |
            .gradle/loom-cache
            fabric/.gradle/loom-cache
          restore-keys: ${{ runner.os }}-gradle-loom-
          key: ${{ runner.os }}-gradle-loom-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Execute build
        run: ./gradlew clean build --stacktrace
