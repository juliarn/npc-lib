[versions]

# plugins
shadow = "9.6.0"
spotless = "8.8.0"
nexusPublish = "2.0.0"
checkstyleTools = "13.8.0"

# general
gson = "2.14.0"
slf4j = "2.0.18"
geantyref = "1.3.16"
annotations = "26.1.0"
netty = "4.1.117.Final"

# platform api versions
sponge = "10.0.0"
paper = "26.2.build.62-beta"
minestom = "2026.07.12-26.2"

# fabric
minecraft = "26.2"
fabricLoom = "1.17.16"
fabricLoader = "0.19.3"
fabricApi = "0.155.2+26.2"

# platform extensions
packetEvents = "2.13.0"
protocolLib = "8eeb82f89d"


[libraries]

# general
netty = { group = "io.netty", name = "netty-buffer", version.ref = "netty" }
slf4jApi = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
annotations = { group = "org.jetbrains", name = "annotations", version.ref = "annotations" }
geantyref = { group = "io.leangen.geantyref", name = "geantyref", version.ref = "geantyref" }

# platform api
paper = { group = "io.papermc.paper", name = "paper-api", version.ref = "paper" }
minestom = { group = "net.minestom", name = "minestom", version.ref = "minestom" }
sponge = { group = "org.spongepowered", name = "spongeapi", version.ref = "sponge" }

# fabric
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
fabricLoader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabricLoader" }
fabricApiBom = { module = "net.fabricmc.fabric-api:fabric-api-bom", version.ref = "fabricApi" }
fabricApiNetworkingV1 = { module = "net.fabricmc.fabric-api:fabric-networking-api-v1" }

# platform extensions
protocolLib = { group = "com.github.dmulloy2", name = "ProtocolLib", version.ref = "protocolLib" }
packetEvents = { group = "com.github.retrooper", name = "packetevents-spigot", version.ref = "packetEvents" }

# dummy version, just here for renovate to detect that there is something to update
checkstyleTools = { group = "com.puppycrawl.tools", name = "checkstyle", version.ref = "checkstyleTools" }

[plugins]

shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
fabricLoom = { id = "net.fabricmc.fabric-loom", version.ref = "fabricLoom" }
nexusPublish = { id = "io.github.gradle-nexus.publish-plugin", version.ref = "nexusPublish" }
